<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ints-head-gs — GS viability spike</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0a0c10; }
      /* Editorial-portrait backdrop, same intent as ints-head's radial gradient. */
      #stage {
        position: fixed;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 42%, #222a36 0%, #141821 55%, #080a0e 100%);
      }
      #gs { width: 100%; height: 100%; }
      #hud {
        position: fixed;
        top: 10px; left: 12px;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #cbd5e1;
        background: rgba(8, 10, 14, 0.55);
        backdrop-filter: blur(6px);
        padding: 8px 11px;
        border-radius: 8px;
        white-space: pre;
        pointer-events: none;
        z-index: 10;
      }
      #boot {
        position: fixed; inset: 0;
        display: grid; place-items: center;
        font: 14px ui-monospace, monospace; color: #64748b;
        z-index: 5;
      }
      #boot.hidden { display: none; }

      /* upload / drop zone */
      #upload {
        position: fixed;
        bottom: 12px; left: 12px;
        font: 12px/1.5 ui-monospace, monospace;
        color: #cbd5e1;
        background: rgba(8, 10, 14, 0.55);
        backdrop-filter: blur(6px);
        border: 1px dashed #3a4658;
        border-radius: 8px;
        padding: 9px 12px;
        z-index: 10;
        max-width: 360px;
      }
      #upload b { color: #7dd3fc; font-weight: 600; }
      #upload label { color: #93c5fd; text-decoration: underline; cursor: pointer; }
      #upload input { display: none; }
      #upStatus { white-space: pre-wrap; margin-top: 4px; color: #94a3b8; }
      #upStatus.ok { color: #86efac; }
      #upStatus.err { color: #fca5a5; }
      body.dragging #upload { border-color: #7dd3fc; background: rgba(20, 30, 45, 0.8); }
      #variants { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
      #variants:empty { display: none; }
      #variants .chip {
        font: 11px ui-monospace, monospace; color: #cbd5e1;
        background: rgba(30, 41, 59, 0.8); border: 1px solid #3a4658;
        border-radius: 6px; padding: 2px 7px; cursor: pointer; pointer-events: auto;
      }
      #variants .chip:hover { border-color: #7dd3fc; }
      #variants .chip.active { color: #0a0c10; background: #7dd3fc; border-color: #7dd3fc; }

      /* speech test bar */
      #speech {
        position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 6px; align-items: center; z-index: 10;
        font: 12px ui-monospace, monospace;
        background: rgba(8, 10, 14, 0.6); backdrop-filter: blur(6px);
        border: 1px solid #3a4658; border-radius: 8px; padding: 6px 8px;
      }
      #phrase {
        width: 360px; background: rgba(20, 30, 45, 0.9); color: #e2e8f0;
        border: 1px solid #3a4658; border-radius: 6px; padding: 5px 8px;
        font: 12px ui-monospace, monospace; outline: none;
      }
      #phrase:focus { border-color: #7dd3fc; }
      #say {
        background: #7dd3fc; color: #0a0c10; border: none; border-radius: 6px;
        padding: 5px 12px; font: 600 12px ui-monospace, monospace; cursor: pointer;
      }
      #say:hover { background: #a5e0fb; }
    </style>
  </head>
  <body>
    <div id="stage"><div id="gs"></div></div>
    <div id="hud">booting…</div>
    <div id="boot">loading Gaussian-splat avatar…</div>
    <div id="speech">
      <input id="phrase" type="text" value="Hello, I am your digital head. Watch my mouth move." />
      <button id="say">say</button>
    </div>
    <div id="upload">
      <b>avatar</b> — drop a LAM OAC <code>.zip</code> anywhere, or
      <label for="file">browse</label><input id="file" type="file" accept=".zip" />
      <div id="upStatus">using bundled p2-1.zip</div>
      <div id="variants"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
