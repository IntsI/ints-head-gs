<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ints-head-gs — GS viability spike</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0a0c10; }
      /* Editorial-portrait backdrop, same intent as ints-head's radial gradient. */
      #stage {
        position: fixed;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 42%, #222a36 0%, #141821 55%, #080a0e 100%);
      }
      #gs { width: 100%; height: 100%; }
      #hud {
        position: fixed;
        top: 10px; left: 12px;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #cbd5e1;
        background: rgba(8, 10, 14, 0.55);
        backdrop-filter: blur(6px);
        padding: 8px 11px;
        border-radius: 8px;
        white-space: pre;
        pointer-events: none;
        z-index: 10;
      }
      #boot {
        position: fixed; inset: 0;
        display: grid; place-items: center;
        font: 14px ui-monospace, monospace; color: #64748b;
        z-index: 5;
      }
      #boot.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"><div id="gs"></div></div>
    <div id="hud">booting…</div>
    <div id="boot">loading Gaussian-splat avatar…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
