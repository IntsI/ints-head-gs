<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLAME teeth + live-drive spike</title>
    <!-- SYNC SHIM (inert unless ?seed= is present): lets compare3.html drive N
         panels from ONE shared clock + seeded RNG, so the living base
         (blink/breath/gaze) is byte-identical across panels and the ONLY visible
         difference is facial proportions. A classic inline script runs BEFORE the
         deferred module below, so the rig boots already shimmed. Normal use and
         compare.html (no ?seed) are completely untouched. -->
    <script>
      (function () {
        var sp = new URLSearchParams(location.search);
        if (!sp.has("seed")) return; // default / compare.html: do nothing
        var seed = (parseInt(sp.get("seed"), 10) || 1) >>> 0;
        // mulberry32 — deterministic PRNG, reseeded at the shared "go" instant
        function mk(s) {
          return function () {
            s |= 0; s = (s + 0x6d2b79f5) | 0;
            var t = Math.imul(s ^ (s >>> 15), 1 | s);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        var rng = mk(seed), started = false;
        function P() { try { return window.parent !== window ? window.parent : null; } catch (e) { return null; } }
        // Seeded RNG: blink/saccade intervals become deterministic. The load path
        // draws a per-avatar number of randoms, so we RESEED once at "go" — after
        // that only the (identical) idle consumes it, so panels stay in lockstep.
        Math.random = function () {
          var p = P();
          if (p && p.__syncGo && !started) { started = true; rng = mk(seed); }
          return rng();
        };
        // Shared clock: frozen until the parent flips __syncGo (all panels loaded),
        // then every panel reads the SAME elapsed time → identical dt, breath, gaze.
        var realNow = performance.now.bind(performance);
        performance.now = function () {
          var p = P();
          try {
            if (!p) return realNow();                   // standalone (no parent): normal time
            if (!p.__syncGo) return 0;                  // in a panel, pre-go: idle frozen, no drift
            return p.__syncClock - p.__syncEpoch;       // post-go: shared elapsed ms
          } catch (e) { return realNow(); }
        };
      })();
    </script>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0a0c10; }
      #stage { position: fixed; inset: 0;
        background: radial-gradient(120% 90% at 50% 42%, #222a36 0%, #141821 55%, #080a0e 100%); }
      #gs { width: 100%; height: 100%; }
      #hud {
        position: fixed; top: 10px; left: 12px; z-index: 10;
        font: 12px/1.6 ui-monospace, monospace; color: #cbd5e1;
        background: rgba(8,10,14,0.6); backdrop-filter: blur(6px);
        padding: 9px 12px; border-radius: 8px; white-space: pre-wrap; max-width: 44vw;
      }
      #bar {
        position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
        display: flex; gap: 8px; align-items: center;
        font: 12px ui-monospace, monospace; color: #cbd5e1;
        background: rgba(8,10,14,0.6); backdrop-filter: blur(6px);
        border: 1px solid #3a4658; border-radius: 8px; padding: 8px 12px;
      }
      #jaw { width: 130px; }
      #phrase { width: 300px; }
      #mic { background: #475569; color: #e2e8f0; }
      #mic:hover { background: #57647a; }
      #mic.listening { background: #f87171; color: #0a0c10; }
      #mic.unsupported { opacity: 0.4; cursor: not-allowed; }
      #chatStatus {
        position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
        font: 11px ui-monospace, monospace; color: #94a3b8; z-index: 10;
        max-width: 70vw; text-align: center; white-space: pre-wrap;
      }
      #chatStatus.ok { color: #86efac; } #chatStatus.err { color: #fca5a5; }
      #reply {
        position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
        max-width: 60vw; text-align: center; z-index: 10;
        font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; color: #e2e8f0;
        text-shadow: 0 1px 6px rgba(0,0,0,0.7); pointer-events: none;
      }
      #reply:empty { display: none; }
      button, input[type=text] {
        font: 12px ui-monospace, monospace; border-radius: 6px; border: 1px solid #3a4658;
        background: #1e293b; color: #e2e8f0; padding: 5px 10px;
      }
      button { background: #7dd3fc; color: #0a0c10; border: none; font-weight: 600; cursor: pointer; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center;
        font: 14px ui-monospace, monospace; color: #64748b; z-index: 5; }
      #boot.hidden { display: none; }

      /* ---- live control panel ---- */
      #panel {
        position: fixed; top: 0; right: 0; z-index: 20; width: 320px; height: 100vh;
        overflow-y: auto; box-sizing: border-box; padding: 12px 14px 40px;
        background: rgba(8,10,14,0.82); backdrop-filter: blur(8px);
        border-left: 1px solid #1e293b; font: 11px ui-monospace, monospace; color: #cbd5e1;
        transition: transform 0.2s ease;
      }
      #panel.hidden { transform: translateX(100%); }
      #panel h2 { font-size: 12px; margin: 4px 0 8px; color: #e2e8f0; letter-spacing: .04em; }
      #panel .grp { color: #7dd3fc; font-weight: 700; margin: 14px 0 4px; text-transform: uppercase;
        font-size: 10px; letter-spacing: .08em; border-bottom: 1px solid #1e293b; padding-bottom: 2px; }
      .row { display: grid; grid-template-columns: 1fr 96px 34px; gap: 6px; align-items: center; margin: 3px 0; }
      .row label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row input[type=range] { width: 100%; }
      .row .val { text-align: right; color: #94a3b8; }
      #presets { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
      #presets button { background: #334155; color: #e2e8f0; padding: 4px 8px; font-size: 11px; }
      #presets button.active { background: #fcd34d; color: #0a0c10; }
      #panelbtns { display: flex; gap: 6px; align-items: center; margin: 8px 0 2px; }
      #panelbtns button { padding: 4px 9px; }
      #intensity { width: 130px; }
      #panelToggle { position: fixed; top: 10px; right: 12px; z-index: 21; padding: 6px 10px; }
      .hint { color: #64748b; }
    </style>
  </head>
  <body>
    <div id="stage"><div id="gs"></div></div>
    <div id="hud">FLAME teeth spike — booting…</div>
    <div id="boot">loading FLAME avatar…</div>

    <button id="panelToggle">panel ⟩</button>
    <div id="panel" class="hidden">
      <h2>ARKit blendshape panel</h2>
      <div id="presets"></div>
      <div id="panelbtns">
        <label>intensity <input id="intensity" type="range" min="0" max="1.5" step="0.05" value="1" /></label>
        <span id="intensityVal" class="val">1.00</span>
      </div>
      <div id="panelbtns">
        <button id="resetBtn">reset neutral</button>
        <span class="hint">layers over breath+blink+gaze</span>
      </div>
      <div id="sliders"></div>
    </div>

    <div id="reply"></div>
    <div id="chatStatus"></div>
    <div id="bar">
      <label>jaw <input id="jaw" type="range" min="0" max="0.5" step="0.01" value="0" /></label>
      <button id="mic" title="speak (Web Speech API)">🎤</button>
      <input id="phrase" type="text" placeholder="say something to the head…" />
      <button id="say">send</button>
    </div>
    <script type="module" src="/src/flame-spike.ts"></script>
  </body>
</html>
